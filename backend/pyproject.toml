[project]
name = "gitprobe"
version = "0.1.0"
description = "Peek at every store's inventory before you buy. Zero TCGplayer."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.27",
    "ijson>=3.2",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
sync-scryfall = "app.workers.sync_scryfall:main"
sync-stores = "app.workers.sync_stores:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
